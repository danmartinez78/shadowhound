<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; ry: 8; }
      .title { font: 600 16px Inter, Arial, sans-serif; fill: #111827; }
      .text { font: 14px Inter, Arial, sans-serif; fill: #374151; }
      .caption { font: italic 12px Inter, Arial, sans-serif; fill: #4b5563; }
      .link { stroke: #2563eb; stroke-width: 2.5; }
      .link-dashed { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 6 6; }
      .port { font: 12px Inter, Arial, sans-serif; fill: #1f2937; }
      .badge { fill: #eef2ff; stroke: #4338ca; stroke-width: 1; rx: 6; ry: 6; }
      .badge-text { font: 12px Inter, Arial, sans-serif; fill: #3730a3; }
    </style>
  </defs>

  <!-- Title -->
  <text x="20" y="28" class="title">ShadowHound Router-Based Topology (Recommended)</text>
  <text x="20" y="48" class="caption">GL.iNet travel router in AP/Bridge mode provides a low-latency LAN for WebRTC and DDS</text>

  <!-- Router -->
  <rect x="420" y="140" width="140" height="80" class="box"/>
  <text x="490" y="162" text-anchor="middle" class="title">Router/AP</text>
  <text x="490" y="182" text-anchor="middle" class="text">AP / Bridge mode</text>
  <text x="490" y="202" text-anchor="middle" class="text">192.168.10.1/24</text>
  <rect x="434" y="210" width="112" height="22" class="badge"/>
  <text x="490" y="226" text-anchor="middle" class="badge-text">GL.iNet GL‑SFT1200</text>

  <!-- Laptop -->
  <rect x="60" y="130" width="180" height="100" class="box"/>
  <text x="150" y="152" text-anchor="middle" class="title">Laptop</text>
  <text x="150" y="172" text-anchor="middle" class="text">DevContainer, Web UI</text>
  <text x="150" y="192" text-anchor="middle" class="text">IP: 192.168.10.100</text>
  <rect x="88" y="200" width="124" height="22" class="badge"/>
  <text x="150" y="216" text-anchor="middle" class="badge-text">Wi‑Fi (5 GHz)</text>

  <!-- Thor -->
  <rect x="760" y="70" width="180" height="120" class="box"/>
  <text x="850" y="92" text-anchor="middle" class="title">Thor (Jetson)</text>
  <text x="850" y="112" text-anchor="middle" class="text">Edge compute</text>
  <text x="850" y="132" text-anchor="middle" class="text">eth0: 192.168.10.3/24</text>
  <text x="850" y="152" text-anchor="middle" class="text">+ 192.168.123.10/24</text>
  <rect x="794" y="158" width="112" height="22" class="badge"/>
  <text x="850" y="174" text-anchor="middle" class="badge-text">Ethernet</text>

  <!-- GO2 -->
  <rect x="760" y="250" width="180" height="120" class="box"/>
  <text x="850" y="272" text-anchor="middle" class="title">Unitree GO2</text>
  <text x="850" y="292" text-anchor="middle" class="text">Factory eth0: 192.168.123.161</text>
  <text x="850" y="312" text-anchor="middle" class="text">Wi‑Fi: 192.168.10.103 (DHCP)</text>
  <rect x="794" y="318" width="112" height="22" class="badge"/>
  <text x="850" y="334" text-anchor="middle" class="badge-text">Wi‑Fi</text>

  <!-- Links -->
  <!-- Laptop WiFi to Router -->
  <line x1="240" y1="180" x2="420" y2="180" class="link"/>
  <text x="330" y="170" class="port" text-anchor="middle">Wi‑Fi</text>

  <!-- Thor Ethernet to Router -->
  <line x1="760" y1="130" x2="560" y2="180" class="link"/>
  <text x="660" y="140" class="port" text-anchor="middle">Ethernet</text>

  <!-- GO2 WiFi to Router -->
  <line x1="760" y1="300" x2="560" y2="220" class="link-dashed"/>
  <text x="660" y="260" class="port" text-anchor="middle">Wi‑Fi</text>

  <!-- Caption -->
  <text x="20" y="390" class="caption">Notes: Router in AP/Bridge mode (192.168.10.1/24). Thor adds secondary IP 192.168.123.10 to reach GO2 factory subnet 192.168.123.0/24.</text>
</svg>
