name: Validate Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/validate_wikilinks.py'
  push:
    branches:
      - main
      - dev
    paths:
      - 'docs/**'
      - 'tools/validate_wikilinks.py'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Validate wikilinks
        run: python tools/validate_wikilinks.py --docs docs
