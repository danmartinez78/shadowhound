site_name: ShadowHound Documentation
site_description: "ShadowHound / Robot Dog knowledge base"
docs_dir: docs
site_url: ""
theme:
  name: material
  features:
    - navigation.expand
    - navigation.sections
    - navigation.tabs
    - content.code.copy
    - toc.integrate
nav:
  - Home: index.md
  - Project Overview:
      - Roadmap: project_overview/roadmap.md
      - Quick Start Launch Checklist: project_overview/quick_start.md
      - Quick Reference: project_overview/quick_reference.md
      - Project Setup Status (Oct 4 2025): project_overview/setup_status.md
      - Architecture Review Summary: project_overview/architecture_review_summary.md
      - Project TODO Backlog: project_overview/todo.md
  - Hardware:
      - Overview: hardware/hardware_hub.md
  - Software:
      - Overview: software/software_hub.md
      - Script Catalog: software/scripts.md
      - Environment Configuration: software/environment_configuration.md
      - Start Script Reference: software/start_script_reference.md
      - DIMOS Integration Quick Start: software/dimos_quick_start.md
      - ROS 2 Workstation Setup: software/ros2_setup.md
      - Isaac Sim Remote Streaming: software/isaac_sim_remote.md
      - Autodoc:
          - Index: software/autodoc/_index.md
  - Networking:
      - Overview: networking/networking_hub.md
      - WebRTC Direct Test: networking/webrtc_direct_test.md
      - ROS 2 DDS Direct Test: networking/dds_direct_test.md
  - Simulation:
      - Overview: simulation/simulation_hub.md
  - Troubleshooting:
      - Overview: troubleshooting/troubleshooting_hub.md
  - Research:
      - Overview: research/research_hub.md
      - Personality and Mission Execution: research/personality_and_mission_execution.md
      - Alignment Review (Oct 15): research/alignment_review_persistent_intelligence_oct15.md
      - Ops vs Avatar: Concrete Examples: research/ops_vs_avatar_concrete_examples.md
      - Persistent Intelligence:
          - Architecture: research/persistent_intelligence_architecture_shadowHound.md
          - Early Design Priorities: research/shadowHound_early_design_priorities.md
          - DIMOS Integration: research/persistent_intelligence_dimos_integration.md
      - LoRA/Adapters for Persistent Intelligence: research/lora_adapters_persistent_intelligence.md
      - MVP Navigation & Perception (Oct 2025):
          - Persistent Intelligence MVP: research/persistent_intelligence_mvp.md
          - Day-One System Context: research/persistent_intelligence_day_one_system_context.md
          - Local Planning Architecture: research/local_planning_architecture.md
          - Hybrid Perception Architecture: research/hybrid_perception_architecture.md
          - Local Planning Quickstart: research/local_planning_quickstart.md
      - Development Log: research/devlog.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
plugins:
  - search
