# Nav2 Parameters for fully namespaced robots
# Each robot runs Nav2 under its own ROS namespace (e.g. robot0)
# Frames are unprefixed: map, odom, base_link (namespacing isolates them)
# Costmaps use standard plugin layout; no RewrittenYaml needed.

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.25
    update_min_a: 0.2
    transform_tolerance: 1.0
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.1

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names: [
      nav2_compute_path_to_pose_action_bt_node,
      nav2_follow_path_action_bt_node,
      nav2_spin_action_bt_node,
      nav2_wait_action_bt_node,
      nav2_back_up_action_bt_node,
      nav2_clear_costmap_service_bt_node,
      nav2_goal_reached_condition_bt_node,
      nav2_is_path_valid_condition_bt_node,
      nav2_rate_controller_bt_node,
      nav2_distance_controller_bt_node,
      nav2_recovery_node_bt_node,
      nav2_pipeline_sequence_bt_node,
      nav2_round_robin_node_bt_node,
      nav2_transform_available_condition_bt_node,
      nav2_time_expired_condition_bt_node,
      nav2_path_expiring_timer_condition,
      nav2_distance_traveled_condition_bt_node,
      nav2_navigate_to_pose_action_bt_node,
      nav2_remove_passed_goals_action_bt_node
    ]

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    robot_base_frame: base_link
    odom_frame: odom
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.6
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.5
      acc_lim_x: 2.0
      acc_lim_theta: 3.0
      decel_lim_x: -2.0
      decel_lim_theta: -3.0
      vx_samples: 15
      vtheta_samples: 20
      sim_time: 1.2
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      GoalAlign.scale: 20.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.3
      allow_unknown: false
      max_iterations: 100000
      max_planning_time: 2.5
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 0.30
      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 1.5
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      smooth_path: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

# Costmaps (namespaced topics & frames handled by node namespace)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6.0
      height: 6.0
      resolution: 0.05
      always_send_full_costmap: true
      footprint: "[ [0.360, 0.200], [0.360, -0.200], [-0.450, -0.200], [-0.450, 0.200] ]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      width: 50.0
      height: 50.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: false
      always_send_full_costmap: true
      footprint: "[ [0.360, 0.200], [0.360, -0.200], [-0.450, -0.200], [-0.450, 0.200] ]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.0
        inflation_radius: 0.55

lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: ["amcl", "map_server", "planner_server", "controller_server", "bt_navigator", "behavior_server", "waypoint_follower", "local_costmap", "global_costmap"]
    bond_timeout: 5.0
