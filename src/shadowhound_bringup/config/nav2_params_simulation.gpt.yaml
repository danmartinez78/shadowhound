# Simplified Nav2 params for multi-robot (namespace injected at launch)
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    robot_base_frame: base_link
    odom_frame: odom
    controller_plugins: [FollowPath]
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      critics: [PathAlign, PathDist, GoalDist]

local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    plugins: [voxel_layer, inflation_layer]
    voxel_layer:
      plugin: nav2_costmap_2d::VoxelLayer
      observation_sources: scan
      scan:
        topic: scan
        data_type: LaserScan
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.25

global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    plugins: [static_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.25

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
